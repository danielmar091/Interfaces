<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>FORMULARIO IVAN EL MOVIL.</h1>
    </header>
    <main>
        <section id="formulario">
            <h2>Formulario</h2>
            <form id="contactForm">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name">

                <p></p>

                <label for="surname">Apellidos:</label>
                <input type="text" id="surname" name="surname">

                <p></p>

                <label>Sexo:</label>
                <input type="radio" name="sex" value="male">Hombre
                <input type="radio" name="sex" value="female">Mujer
                <input type="radio" name="sex" value="ivanelmovil">Ivan El Movil

                <p></p>

                <label for="message">Nick:</label>
                <input type="text" id="nick" name="nick">
                <p></p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <p></p>
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message"></textarea>
                <p></p>
                <button type="submit">Enviar</button>
                <button type="reset">reset</button>
            </form>
        </section>
    </main>
</body>

</html>
